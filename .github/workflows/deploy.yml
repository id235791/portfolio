# main 브랜치에 push 되면 정적 사이트를 빌드해 GitHub Pages에 배포한다.
# 저장소 Settings > Pages > Source 를 "GitHub Actions"로 설정해야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동으로 다시 배포할 수 있도록 허용
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하나만 실행
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next.config.ts의 output: "export" 설정으로 out/ 폴더에 정적 파일이 생성된다.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
